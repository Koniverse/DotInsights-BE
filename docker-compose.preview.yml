version: "3.8"

services:
  # ── DotInsights BE Server ────────────────────────────────────────────────────
  dot-insights:
    image: ghcr.io/koniverse/dot-insights-be:latest
    env_file:
      - .env
    command: node dist/server.js
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    depends_on:
      - mongo
    ports:
      - "8138:3000"
    logging:
      driver: "json-file"
      options:
        max-file: "3"
        max-size: "50m"

  # ── MongoDB ─────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:4.2.8
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo
      MONGO_INITDB_ROOT_PASSWORD: qweqwe123
    volumes:
      - mongo-data:/data/db
    ports:
      - "9000:27017"
    deploy:
      restart_policy:
        condition: any
    logging:
      driver: "json-file"
      options:
        max-file: "3"
        max-size: "50m"

volumes:
  mongo-data:
