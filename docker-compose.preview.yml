services:
  # ── DotInsights BE Server ────────────────────────────────────────────────────
  dot-insights:
    image: ghcr.io/koniverse/dot-insights-be:latest
    env_file:
      - .env
    environment:
      # Override MONGO_URL for Docker networking (service name: mongo)
      MONGO_URL: mongodb://mongo:qweqwe123@mongo:27017/dot_insights?authSource=admin
    command: node dist/server.js
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "8138:3000"
    logging:
      driver: "json-file"
      options:
        max-file: "3"
        max-size: "50m"

  # ── MongoDB ─────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:4.2.8
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo
      MONGO_INITDB_ROOT_PASSWORD: qweqwe123
    volumes:
      - mongo-data:/data/db
    ports:
      - "9000:27017"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-file: "3"
        max-size: "50m"

volumes:
  mongo-data:
