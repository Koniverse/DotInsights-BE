name: Deploy DotInsights BE to VM

on:
  push:
    branches:
      - main
      - dev
      - staging
      - '**'

jobs:
  deploy:
    if: "!startsWith(github.event.head_commit.message, '[CI Skip]')"
    runs-on: ubuntu-latest
    environment: ${{ github.event.pull_request.base.ref || github.ref_name }}
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
      DI_VERSION: ${{ vars.DI_VERSION || github.sha }}
      DI_FOLDER: ${{ vars.DI_FOLDER || 'dot-insights-be' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install

      # ── Build image using preview Dockerfile ─────────────────────────────
      - name: Build Docker Image
        run: |
          docker build \
            -f Dockerfile.preview \
            -t ghcr.io/koniverse/dot-insights-be:${DI_VERSION} \
            -t ghcr.io/koniverse/dot-insights-be:latest \
            .

      # ── Push image to GitHub Container Registry ──────────────────────────
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: koniverse
          password: ${{ secrets.GH_TOKEN }}

      - name: Push Docker Image
        run: |
          docker push ghcr.io/koniverse/dot-insights-be:${DI_VERSION}
          docker push ghcr.io/koniverse/dot-insights-be:latest
